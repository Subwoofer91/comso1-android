<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <link rel="stylesheet" href="xterm.css">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050607; }
    body { position: fixed; inset: 0; max-width: 100vw; contain: strict; }
    #terminal { position: absolute; inset: 0; overflow: hidden; }
    .xterm { padding: 8px 8px 4px; box-sizing: border-box; }
    .xterm .xterm-helper-textarea {
      left: 0 !important; top: 0 !important; width: 1px !important; height: 1px !important;
      z-index: 30 !important;
    }
    .xterm-viewport { scrollbar-width: none; }
    .xterm-viewport::-webkit-scrollbar { width: 0; height: 0; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script>
    (() => {
      window.addEventListener('error', event => {
        if (window.AndroidTerminal) AndroidTerminal.onError(event.message || '终端渲染器错误');
      });
      try {
      const terminal = new Terminal({
        cursorBlink: true,
        cursorStyle: 'block',
        fontFamily: 'monospace',
        fontSize: 14,
        lineHeight: 1.2,
        scrollback: 5000,
        convertEol: false,
        allowProposedApi: false,
        theme: {
          background: '#050607', foreground: '#e7eaf0', cursor: '#9ab8ee',
          selectionBackground: '#294b7dcc', black: '#050607', brightBlack: '#6c727d',
          blue: '#6f91cf', brightBlue: '#9ab8ee', cyan: '#70b7c7', brightCyan: '#91d6e6'
        }
      });
      const fitAddon = new FitAddon.FitAddon();
      terminal.loadAddon(fitAddon);
      const terminalElement = document.getElementById('terminal');
      terminal.open(terminalElement);

      // xterm falls back to a 15px scrollbar reservation when the measured scrollbar
      // width is 0, but this viewport hides its scrollbar. Reserve nothing so the
      // grid really spans the available width instead of wasting one or two columns.
      try {
        const viewport = terminal._core && terminal._core.viewport;
        if (viewport) viewport.scrollBarWidth = 0;
      } catch (_) {
        // Keep the default fit behavior if the bundled xterm internals change.
      }
      let locked = false;
      let ready = false;
      let readyReported = false;
      let fitRevision = 0;
      let fitting = false;
      let fitTimer = 0;

      function bytesToBase64(bytes) {
        let binary = '';
        for (let i = 0; i < bytes.length; i += 0x8000) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        }
        return btoa(binary);
      }

      function reportSize() {
        if (!ready || locked) return;
        AndroidTerminal.onResize(terminal.cols, terminal.rows, window.innerWidth, window.innerHeight);
      }

      function fitAfterMetricsSettle() {
        const revision = ++fitRevision;
        fitting = true;
        clearTimeout(fitTimer);

        // Keep the local canvas responsive during IME animation, but debounce the PTY
        // resize until both the viewport and font metrics have stopped changing.
        requestAnimationFrame(() => {
          if (revision === fitRevision && !locked) fitAddon.fit();
        });
        fitTimer = setTimeout(() => {
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (revision !== fitRevision || locked) return;
            fitAddon.fit();
            fitting = false;
            reportSize();
          }));
        }, 360);
      }

      function notifyReady() {
        if (!terminalElement.clientWidth || !terminalElement.clientHeight) {
          requestAnimationFrame(notifyReady);
          return;
        }
        ready = true;
        fitting = true;
        fitAddon.fit();
        fitting = false;
        if (!readyReported) {
          readyReported = true;
          AndroidTerminal.onReady(terminal.cols, terminal.rows, window.innerWidth, window.innerHeight);
        } else {
          reportSize();
        }
        terminal.focus();
      }

      terminal.onData(data => AndroidTerminal.onData(bytesToBase64(new TextEncoder().encode(data))));
      terminal.onBinary(data => {
        const bytes = new Uint8Array(data.length);
        for (let i = 0; i < data.length; i++) bytes[i] = data.charCodeAt(i) & 255;
        AndroidTerminal.onData(bytesToBase64(bytes));
      });
      terminal.onResize(() => {
        if (!fitting) reportSize();
      });
      document.addEventListener('click', () => terminal.focus());

      window.ComsoTerminal = {
        writeBase64(value) {
          const binary = atob(value);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          terminal.write(bytes);
        },
        clear() { terminal.clear(); },
        focus() { terminal.focus(); },
        fit() { fitAfterMetricsSettle(); },
        notifyReady,
        setLocked(value) { locked = !!value; if (!locked) fitAfterMetricsSettle(); },
        setFontSize(value) {
          const nextSize = Math.max(9, Math.min(28, Number(value) || 14));
          terminal.options.fontSize = nextSize;
          terminal.clearTextureAtlas();
          terminal.refresh(0, terminal.rows - 1);
          fitAfterMetricsSettle();
        }
      };

      window.addEventListener('resize', fitAfterMetricsSettle);
      window.visualViewport?.addEventListener('resize', fitAfterMetricsSettle);
      const terminalResizeObserver = new ResizeObserver(fitAfterMetricsSettle);
      terminalResizeObserver.observe(terminalElement);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) fitAfterMetricsSettle();
      });
      document.addEventListener('touchstart', event => {
        if (event.touches.length === 1) terminal.focus();
      }, { passive: true });

      // Re-assert the grid even when no local resize event fires. This repairs a
      // resize that raced with the SSH handshake, and keeps the remote PTY and the
      // xterm grid in lockstep after late layout changes.
      setInterval(() => {
        if (ready && !locked && !fitting) reportSize();
      }, 1500);

      requestAnimationFrame(() => {
        notifyReady();
      });
      } catch (error) {
        AndroidTerminal.onError(error && error.message ? error.message : String(error));
      }
    })();
  </script>
</body>
</html>
